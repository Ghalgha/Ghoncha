name: Temporary Cargo lockfile bootstrap

on:
  push:
    branches: [work/rustls-dependency-bootstrap]
    paths:
      - ".github/workflows/lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Android platform dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Cargo.toml")
          text = path.read_text()
          marker = '    "crates/transport-turn",'
          if marker not in text:
              raise SystemExit("workspace member anchor not found")
          if '"crates/platform-android"' not in text:
              text = text.replace(marker, marker + '\n    "crates/platform-android",', 1)
              path.write_text(text)
          PY
          cargo metadata --format-version 1 > /tmp/cargo-metadata.json
          git checkout -- Cargo.toml
          git diff --check
          git diff -- Cargo.lock
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Update Cargo lockfile for Android verifier"
            git push origin HEAD:work/rustls-dependency-bootstrap
          fi
