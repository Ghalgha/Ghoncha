name: Temporary Cargo lockfile bootstrap

on:
  push:
    branches: [work/rustls-dependency-bootstrap]
    paths:
      - ".github/workflows/lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve workspace dependencies
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > /tmp/cargo-metadata.json
          git diff --check
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Update Cargo lockfile for Android TLS config"
            git push origin HEAD:work/rustls-dependency-bootstrap
          fi
